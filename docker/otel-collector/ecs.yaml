receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: catalog
          scrape_interval: 15s
          static_configs:
            - targets: [127.0.0.1:9464]
        - job_name: orders
          scrape_interval: 15s
          static_configs:
            - targets: [127.0.0.1:9465]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  resource:
    attributes:
      - key: deployment.environment.name
        value: ecs-test
        action: upsert
      - key: cloud.provider
        value: aws
        action: upsert
      - key: cloud.region
        value: ${env:AWS_REGION}
        action: upsert
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlp/jaeger:
    endpoint: 127.0.0.1:14317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: pipeline
    resource_to_telemetry_conversion:
      enabled: true
  awscloudwatchlogs:
    log_group_name: /pipeline-otel/ecs-test
    log_stream_name: otel
    region: ${env:AWS_REGION}
    log_retention: 1
    raw_log: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 18888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [awscloudwatchlogs]
